
name: OrangeFox - Cricket Dream 5G

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "OrangeFox source branch matching your device tree"
        required: true
        default: "11.0"
        type: choice
        options:
          - "11.0"
          - "12.1"
          - "14.1"

      DEVICE_TREE:
        description: "EC211001 recovery-tree HTTPS Git URL"
        required: true
        type: string

      DEVICE_TREE_BRANCH:
        description: "Existing branch in your recovery-tree repository"
        required: true
        type: string

      DEVICE_PATH:
        description: "Device path required by the tree makefiles"
        required: true
        default: "device/fih/EC211001"
        type: string

      LUNCH_TARGET:
        description: "Exact lunch target defined by your recovery tree"
        required: true
        type: string

      BUILD_TARGET:
        description: "Image target verified against your device configuration"
        required: true
        type: choice
        options:
          - bootimage
          - recoveryimage
          - vendorbootimage

      AB_DEVICE:
        description: "Enable OrangeFox A/B support when required by the tree"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: orangefox-ec211001-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OrangeFox for EC211001
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      SOURCE_DIR: ${{ github.workspace }}/OrangeFox/source
      LOG_DIR: ${{ github.workspace }}/logs
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts

      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      LUNCH_TARGET: ${{ inputs.LUNCH_TARGET }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      AB_DEVICE: ${{ inputs.AB_DEVICE }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Validate inputs and fetch device tree
        run: |
          set -euo pipefail

          mkdir -p "$LOG_DIR" "$ARTIFACT_DIR"

          if [[ "$DEVICE_TREE" != https://* ]]; then
            echo "::error::DEVICE_TREE must be an HTTPS Git URL."
            exit 1
          fi

          if [[ ! "$DEVICE_PATH" =~ ^device/[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$ ||
                "$DEVICE_PATH" == *".."* ]]; then
            echo "::error::Invalid DEVICE_PATH."
            echo "Expected a path such as device/fih/EC211001."
            exit 1
          fi

          if [[ ! "$LUNCH_TARGET" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid LUNCH_TARGET."
            exit 1
          fi

          TREE_DIR="$RUNNER_TEMP/ec211001-tree"
          echo "TREE_DIR=$TREE_DIR" >> "$GITHUB_ENV"

          git clone \
            --single-branch \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE" \
            "$TREE_DIR" \
            2>&1 | tee "$LOG_DIR/tree-clone.log"

          if [[ ! -f "$TREE_DIR/AndroidProducts.mk" ]]; then
            echo "::error::AndroidProducts.mk is missing from the device-tree root."
            exit 1
          fi

          git -C "$TREE_DIR" rev-parse HEAD \
            > "$LOG_DIR/tree-commit.txt"

          cat "$TREE_DIR/AndroidProducts.mk" \
            | tee "$LOG_DIR/products.txt"

          find "$TREE_DIR" \
            -maxdepth 3 \
            -name '*.dependencies' \
            -print \
            > "$LOG_DIR/dependency-files.txt"

          df -h > "$LOG_DIR/disk-before.txt"

      - name: Install build environment
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            ca-certificates

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/misc/scripts.git \
            "$RUNNER_TEMP/fox-scripts"

          git -C "$RUNNER_TEMP/fox-scripts" rev-parse HEAD \
            > "$LOG_DIR/setup-commit.txt"

          sudo bash \
            "$RUNNER_TEMP/fox-scripts/setup/android_build_env.sh" \
            2>&1 | tee "$LOG_DIR/setup.log"

      - name: Sync and verify OrangeFox source
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$SOURCE_DIR")"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            "$RUNNER_TEMP/fox-sync"

          cd "$RUNNER_TEMP/fox-sync"

          git rev-parse HEAD \
            > "$LOG_DIR/sync-script-commit.txt"

          synced=false

          for attempt in 1 2 3; do
            echo "Source synchronization attempt $attempt"

            if ./orangefox_sync.sh \
                --branch "$MANIFEST_BRANCH" \
                --path "$SOURCE_DIR" \
                2>&1 | tee "$LOG_DIR/sync-$attempt.log"; then
              synced=true
              break
            fi

            if (( attempt < 3 )); then
              sleep 30
            fi
          done

          if [[ "$synced" != true ]]; then
            echo "::error::Source synchronization failed."
            exit 1
          fi

          if [[ ! -f "$SOURCE_DIR/build/envsetup.sh" ]]; then
            echo "::error::Android build environment is missing."
            echo "Expected: $SOURCE_DIR/build/envsetup.sh"
            exit 1
          fi

          if [[ ! -d "$SOURCE_DIR/.repo" ]]; then
            echo "::error::Repo metadata is missing from the source directory."
            exit 1
          fi

          cd "$SOURCE_DIR"

          repo manifest -r \
            -o "$LOG_DIR/source-manifest.xml"

          df -h > "$LOG_DIR/disk-after-sync.txt"

      - name: Install validated device tree
        run: |
          set -euo pipefail

          DEST="$SOURCE_DIR/$DEVICE_PATH"

          if [[ -e "$DEST" ]]; then
            echo "::error::Device destination already exists: $DEST"
            echo "Resolve the existing manifest/tree conflict before building."
            exit 1
          fi

          mkdir -p "$(dirname "$DEST")"
          cp -a "$TREE_DIR" "$DEST"

          EXPECTED_COMMIT="$(cat "$LOG_DIR/tree-commit.txt")"
          ACTUAL_COMMIT="$(git -C "$DEST" rev-parse HEAD)"

          if [[ "$EXPECTED_COMMIT" != "$ACTUAL_COMMIT" ]]; then
            echo "::error::Installed device-tree revision does not match preflight."
            exit 1
          fi

      - name: Configure and build recovery
        run: |
          set -euo pipefail

          (
            set -eo pipefail

            # Android environment scripts may reference unset variables.
            set +u

            cd "$SOURCE_DIR"

            export FOX_VARIANT=Unofficial
            export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1

            if [[ "$AB_DEVICE" == true ]]; then
              export FOX_AB_DEVICE=1
            fi

            source build/envsetup.sh
            lunch "$LUNCH_TARGET"

            TARGET_DEVICE="$(get_build_var TARGET_DEVICE)"
            PRODUCT_OUT="$(get_build_var PRODUCT_OUT)"

            if [[ -z "$TARGET_DEVICE" || -z "$PRODUCT_OUT" ]]; then
              echo "::error::Unable to resolve the selected product."
              exit 1
            fi

            if [[ "$PRODUCT_OUT" != /* ]]; then
              PRODUCT_OUT="$SOURCE_DIR/$PRODUCT_OUT"
            fi

            export FOX_BUILD_DEVICE="$TARGET_DEVICE"

            echo "TARGET_DEVICE=$TARGET_DEVICE" >> "$GITHUB_ENV"
            echo "PRODUCT_OUT=$PRODUCT_OUT" >> "$GITHUB_ENV"

            echo "Target device: $TARGET_DEVICE"
            echo "Product output: $PRODUCT_OUT"
            echo "Lunch target: $LUNCH_TARGET"
            echo "Build target: $BUILD_TARGET"

            JOBS="$(nproc)"

            if (( JOBS > 4 )); then
              JOBS=4
            fi

            echo "Build parallelism: $JOBS"

            mka -j"$JOBS" "$BUILD_TARGET"
          ) 2>&1 | tee "$LOG_DIR/build.log"

      - name: Collect recovery artifacts
        run: |
          set -euo pipefail

          if [[ ! -d "$PRODUCT_OUT" ]]; then
            echo "::error::Product output directory is missing."
            exit 1
          fi

          case "$BUILD_TARGET" in
            bootimage)
              IMAGE=boot.img
              ;;
            recoveryimage)
              IMAGE=recovery.img
              ;;
            vendorbootimage)
              IMAGE=vendor_boot.img
              ;;
            *)
              echo "::error::Unsupported build target."
              exit 1
              ;;
          esac

          # Preserve original filenames instead of relabeling images.
          find "$PRODUCT_OUT" \
            -maxdepth 1 \
            -type f \
            ( \
              -name 'OrangeFox*.img' \
              -o -name 'OrangeFox*.zip' \
              -o -name "$IMAGE" \
            ) \
            -exec cp -v {} "$ARTIFACT_DIR/" ;

          if ! find "$ARTIFACT_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.img' \
              -print \
              -quit | grep -q .; then
            echo "::error::No image was collected."
            ls -lah "$PRODUCT_OUT"
            exit 1
          fi

          {
            echo "Device: Cricket Dream 5G EC211001"
            echo "Target: $TARGET_DEVICE"
            echo "Source branch: $MANIFEST_BRANCH"
            echo "Device tree: $DEVICE_TREE"
            echo "Device-tree branch: $DEVICE_TREE_BRANCH"
            echo "Device-tree commit: $(cat "$LOG_DIR/tree-commit.txt")"
            echo "Lunch target: $LUNCH_TARGET"
            echo "Image target: $BUILD_TARGET"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Device testing: NOT PERFORMED"
          } > "$ARTIFACT_DIR/build-info.txt"

          cp "$LOG_DIR/source-manifest.xml" "$ARTIFACT_DIR/"

          cd "$ARTIFACT_DIR"

          find . \
            -maxdepth 1 \
            -type f \
            ! -name SHA256SUMS \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS

      - name: Record final diagnostics
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOG_DIR"

          {
            df -h
            echo
            free -h
          } > "$LOG_DIR/resources-final.txt"

          {
            echo "## OrangeFox EC211001"
            echo
            echo "Job status: $BUILD_STATUS"
            echo "Lunch target: $LUNCH_TARGET"
            echo "Image target: $BUILD_TARGET"
            echo "Device testing: Not performed"

            if [[ "$BUILD_STATUS" != success &&
                  -f "$LOG_DIR/build.log" ]]; then
              echo
              echo "### Last 60 build-log lines"
              echo '```text'
              tail -n 60 "$LOG_DIR/build.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload images and packages
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-EC211001-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-EC211001-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14